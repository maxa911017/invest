<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>投資先生新手原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* 左：沿用投資先生簡易模式版面的可點擊原型；右：測試導覽。手機內固定淺色，頁面外框隨主題切換。 */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#15212d; --muted:#5a6774; --line:#d6dde4; --accent:#1f5a9e; --accent-soft:#e3ecf6;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; --serif:"Noto Serif TC","Songti TC",serif;
  /* App（依截圖取色） */
  --blue:#306bb7; --blue-soft:#dce8f8; --up:#bf333e; --dn:#2f8f5c; --btn-dn:#47a46f;
  --a-ink:#1c1d22; --a-sub:#6c6d76; --g:rgba(118,120,138,.13); --g2:rgba(118,120,138,.2); --card:rgba(255,255,255,.9); --hair:rgba(0,0,0,.07);
  --new:#c8620e; --new-bg:#fff0dc; --new-line:#f0b878;
  --ok:#17704b; --ok-bg:#e4f3ea; --warn-bg:#fff3dc; --bad-bg:#fdeaea;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11171d;--panel:#1a222b;--ink:#e6ecf1;--muted:#9aa7b3;--line:#2f3a45;--accent:#8fb7e3;--accent-soft:#1f2d3c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11171d;--panel:#1a222b;--ink:#e6ecf1;--muted:#9aa7b3;--line:#2f3a45;--accent:#8fb7e3;--accent-soft:#1f2d3c;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top h1{font-family:var(--serif);font-size:clamp(24px,3.4vw,34px);margin:0;text-wrap:balance}
.top p{margin:6px 0 0;color:var(--muted);max-width:70ch;font-size:15px}
.stage{display:grid;grid-template-columns:auto minmax(0,1fr);gap:32px;margin-top:22px;align-items:start}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr)}}

/* ---------- 手機 ---------- */
.phone{position:relative;width:390px;max-width:100%;height:820px;border-radius:44px;border:10px solid #15191f;box-shadow:0 20px 50px rgba(10,20,30,.25);overflow:hidden;display:flex;flex-direction:column;color:var(--a-ink);font-size:15px;justify-self:center;
  background:linear-gradient(165deg,#f8e6d4 0%,#f5ede9 22%,#eceef8 55%,#f3f4f9 100%)}
.sbar{display:flex;justify-content:space-between;padding:10px 26px 2px;font-size:13px;font-weight:700}
.demo{background:#1c1d22;color:#ffd58a;font-size:11px;text-align:center;padding:2px 8px;letter-spacing:.04em}
#top{flex:none}
.scroll{flex:1;overflow-y:auto;padding:4px 14px 96px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
#fixedBar{flex:none}
.nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.96);border-top:1px solid var(--hair);padding:6px 2px 16px;position:relative}
.nav button{border:0;background:none;font:inherit;font-size:12px;color:#7b7c85;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;padding:4px 0}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--blue);font-weight:700}
.nav .mid{position:relative}
.nav .mid .coin{position:absolute;top:-30px;width:58px;height:58px;border-radius:50%;background:var(--blue);color:#fff;font-size:26px;font-weight:700;display:grid;place-items:center;border:5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.nav .mid span.l{margin-top:28px}
.fab{position:absolute;right:12px;bottom:92px;border:0;border-radius:22px;background:#fff;color:var(--blue);font:inherit;font-size:13px;font-weight:700;padding:8px 12px 8px 10px;box-shadow:0 4px 14px rgba(30,60,110,.22);cursor:pointer;z-index:6;display:flex;align-items:center;gap:6px;border:1.5px solid var(--new-line)}
.fab.lift{bottom:168px}

/* 頂部列（首頁） */
.hbar{display:flex;align-items:center;gap:8px;padding:8px 12px 6px}
.ib{width:44px;height:38px;border-radius:12px;background:var(--g);border:0;display:grid;place-items:center;cursor:pointer;color:var(--a-ink)}
.ib svg{width:22px;height:22px}
.avatar{width:46px;height:46px;border-radius:14px;background:var(--g);display:grid;place-items:center;border:0;cursor:pointer}
.avatar i{width:34px;height:34px;border-radius:50%;background:#c9cad2;display:block;position:relative;overflow:hidden}
.avatar i::before{content:"";position:absolute;left:11px;top:6px;width:12px;height:12px;border-radius:50%;background:#fff}
.avatar i::after{content:"";position:absolute;left:6px;top:20px;width:22px;height:16px;border-radius:11px 11px 0 0;background:#fff}
.mode{border:0;background:var(--g);border-radius:10px;padding:6px 8px;cursor:pointer}
.mode span{display:inline-flex;align-items:center;gap:4px;background:var(--blue);color:#fff;font-size:10.5px;border-radius:999px;padding:1px 3px 1px 7px;font-weight:700}
.mode span i{width:11px;height:11px;border-radius:50%;background:#fff;display:block}
.sp{flex:1}
.ptitle{display:flex;align-items:center;justify-content:center;position:relative;padding:8px 12px 8px;min-height:46px}
.ptitle h2{margin:0;font-size:18px;font-weight:700}
.ptitle .bk{position:absolute;left:8px;border:0;background:none;font-size:26px;line-height:1;color:var(--a-ink);cursor:pointer;padding:2px 8px}
.ptitle .rt{position:absolute;right:12px}

/* 共用 */
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card h3{margin:0;font-size:15.5px}
.sec{font-size:17px;font-weight:700;margin:6px 2px -2px;display:flex;align-items:center;justify-content:space-between}
.sub{color:var(--a-sub);font-size:13px}
.tiny{color:var(--a-sub);font-size:11.5px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.up{color:var(--up)} .dn{color:var(--dn)} .flat{color:var(--a-sub)}
.num{font-variant-numeric:tabular-nums}
.big{font-size:28px;font-weight:700}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:12px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;background:var(--blue);color:#fff;text-align:center}
.btn.ghost{background:var(--blue-soft);color:var(--blue)}
.btn.line{background:#fff;border:1.5px solid var(--hair);color:var(--a-ink)}
.btn.sm{display:inline-block;width:auto;padding:6px 12px;font-size:13px;border-radius:999px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pillbtn{border:0;background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:5px 14px;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.tabs{display:flex;background:var(--g);border-radius:14px;padding:0;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;border:0;background:none;font:inherit;font-size:16px;padding:9px 14px 10px;color:#4b4c55;cursor:pointer;position:relative;white-space:nowrap}
.tabs button.on{color:var(--blue)}
.tabs button.on::after{content:"";position:absolute;left:18%;right:18%;bottom:3px;height:3px;border-radius:2px;background:var(--blue)}
.chiprow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;background:var(--g);border-radius:14px;padding:7px}
.chiprow button{flex:none;border:0;border-radius:999px;padding:6px 16px;font:inherit;font-size:15px;background:rgba(255,255,255,.55);color:#4b4c55;cursor:pointer}
.chiprow button.on{background:var(--blue);color:#fff}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--g);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:999px;padding:7px 4px;font:inherit;font-size:14px;cursor:pointer;color:#5b5c66}
.seg button.on{background:#fff;color:var(--a-ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.qt{width:100%;border-collapse:collapse;font-size:15px}
.qt th{background:var(--g);font-weight:400;color:#55565f;font-size:13.5px;padding:7px 6px;text-align:right}
.qt th:first-child{text-align:left}
.qt th .sb{display:inline-block;background:var(--g);border-radius:8px;padding:3px 8px}
.qt th .sb::after{content:" ⇕";color:var(--blue);font-size:11px}
.qt td{padding:10px 6px;border-bottom:1px solid var(--hair);text-align:right;vertical-align:middle}
.qt td:first-child{text-align:left}
.qt tr.clk{cursor:pointer}
.qt .nm b{display:block;font-weight:500;font-size:15.5px;line-height:1.3}
.qt .nm span{color:var(--a-sub);font-size:13.5px}
.tblcard{background:var(--card);border-radius:18px;overflow:hidden}
.more{align-self:center;border:0;background:var(--g);border-radius:10px;padding:6px 16px;font:inherit;font-size:15px;color:#3d3e46;cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{position:relative;background:#fff;border-radius:16px;padding:10px 4px 8px;border:0;font:inherit;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--a-ink);text-align:center;line-height:1.25}
.tile .ic{font-size:26px;line-height:1.1}
.recs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rec{height:96px;border-radius:16px;padding:10px;font-weight:700;font-size:16px;position:relative;overflow:hidden}
.rec::after{content:"";position:absolute;right:-14px;bottom:-24px;width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.45)}
.banner{border-radius:16px;background:linear-gradient(120deg,#2b62c2,#3a7ae0);color:#fff;padding:14px 16px;text-align:center;cursor:pointer;border:0;font:inherit;width:100%}
.banner b{display:block;font-size:20px;letter-spacing:.06em}
.ticker{white-space:nowrap;overflow:hidden;font-size:16px;color:#55565f;margin:0 -14px;padding:0 14px}
.ticker span{display:inline-block;animation:mq 16s linear infinite}
@keyframes mq{from{transform:translateX(10%)}to{transform:translateX(-60%)}}
@media (prefers-reduced-motion:reduce){.ticker span{animation:none}}
.acct{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:500}
.dots2{width:28px;height:20px;position:relative;flex:none}
.dots2::before,.dots2::after{content:"";position:absolute;top:2px;width:17px;height:17px;border-radius:50%}
.dots2::before{left:0;background:#3772c9}.dots2::after{left:10px;background:#e8803a;mix-blend-mode:multiply}
.mask{display:inline-flex;gap:6px}
.mask i{width:20px;height:20px;border-radius:50%;background:#55565f;color:#fff;font-size:11px;font-style:normal;display:grid;place-items:center}
.stat{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--hair);margin-top:10px;padding-top:10px}
.stat>div+div{border-left:1px solid var(--hair);padding-left:12px}
.stat .k{font-size:14px;color:#55565f}
.stat .v{font-size:19px;font-weight:700}

/* 交易頁 */
.ttabs{display:flex;align-items:center;margin:6px 12px 6px auto;width:calc(100% - 52px);background:var(--g);border-radius:12px}
.ttabs button{flex:1;border:0;background:none;font:inherit;font-size:16px;color:#55565f;padding:9px 0 10px;position:relative;cursor:pointer}
.ttabs button.on{color:var(--blue)}
.ttabs button.on::after{content:"";position:absolute;left:22%;right:22%;bottom:3px;height:3px;border-radius:2px;background:var(--blue)}
.ttabs .rf{flex:0 0 44px;font-size:20px}
.acctrow{display:flex;align-items:center;justify-content:space-between;padding:0 14px 6px}
.stk{background:var(--card);border-radius:18px;padding:14px}
.lotsw{display:inline-flex;border:1px solid var(--hair);border-radius:10px;padding:3px;background:#fff}
.lotsw button{border:0;background:none;border-radius:8px;padding:5px 10px;font:inherit;font-size:15px;color:var(--blue);cursor:pointer}
.lotsw button.on{background:var(--blue);color:#fff}
.tag{display:inline-block;background:var(--blue-soft);color:var(--blue);border-radius:6px;padding:0 7px;font-size:13px}
.kinds{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border:1px solid var(--hair);border-radius:14px;padding:4px;gap:2px}
.kinds button{border:0;background:none;border-radius:10px;padding:8px 0;font:inherit;font-size:15px;color:#4b4c55;cursor:pointer}
.kinds button.on{background:var(--blue);color:#fff}
.dd{display:grid;grid-template-columns:1fr 1fr 52px;gap:8px}
.dd button{border:1px solid var(--hair);background:#fff;border-radius:12px;padding:10px 8px;font:inherit;font-size:15px;cursor:pointer;color:var(--a-ink);display:flex;justify-content:center;gap:8px;align-items:center}
.dd button::after{content:"⌄";color:#666;font-size:14px;margin-top:-6px}
.dd button.nodd::after{content:none}
.stp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;align-items:center;background:#fff;border:1px solid var(--hair);border-radius:14px;overflow:hidden;height:48px}
.stepper button{border:0;background:none;width:44px;height:100%;font-size:24px;cursor:pointer;color:var(--blue)}
.stepper .v{flex:1;text-align:center;font-size:19px;font-variant-numeric:tabular-nums}
.book{margin:0 -14px}
.book table{width:100%;border-collapse:collapse;font-size:15px}
.book th{background:var(--g);font-weight:400;color:#55565f;font-size:14px;padding:8px 14px;text-align:right}
.book th:first-child,.book td:first-child{text-align:left}
.book td{padding:9px 14px;border-bottom:1px solid var(--hair);text-align:right}
.bsbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 14px 10px}
.bsbar>div{background:var(--g);border-radius:14px;padding:6px}
.bsbar button{width:100%;border:0;border-radius:999px;padding:11px;font:inherit;font-size:18px;font-weight:700;color:#fff;cursor:pointer;letter-spacing:.2em}
.b-buy{background:var(--up)} .b-sell{background:var(--btn-dn)}

/* 新增元件標示 */
.nw{position:relative;border:1.5px dashed var(--new-line)!important}
.badge{display:inline-block;font-size:10.5px;font-weight:700;color:var(--new);background:var(--new-bg);border-radius:6px;padding:0 6px;line-height:18px;vertical-align:2px;margin-left:4px;letter-spacing:.04em}
.tile .badge{position:absolute;top:4px;right:4px;margin:0}
.explain{background:#eef3fb;border-radius:10px;padding:8px 10px;font-size:13px;color:#22364f;line-height:1.55}
.explain b{color:var(--blue)}
.warn{background:var(--warn-bg);color:#5c3a00;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.55}
.ok{background:var(--ok-bg);color:#0f4d35;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.55}
.bad{background:var(--bad-bg);color:#7a1d1d;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.55}
.guide{background:#fffaf2;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.gh{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:14.5px}
.sw{border:0;border-radius:999px;width:42px;height:24px;background:#c9cbd3;position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--new)}
.sw.on::after{left:21px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--hair);background:#fff;border-radius:999px;padding:4px 11px;font:inherit;font-size:13px;cursor:pointer;color:var(--a-ink)}
.chip.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);font-weight:700}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:13.5px}
.kv .k{color:var(--a-sub)}
.steps3{display:flex;flex-direction:column;gap:8px}
.st3{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;background:rgba(118,120,138,.08);cursor:pointer;border:0;font:inherit;text-align:left;width:100%;color:inherit}
.st3 .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:#fff;border:1.5px solid var(--hair);flex:none}
.st3.done .n{background:var(--ok);color:#fff;border-color:var(--ok)}
.st3.done{opacity:.72}
.range{position:relative;height:10px;border-radius:6px;background:linear-gradient(90deg,#d3ebdd,#eceef2 50%,#f4d6d8)}
.range i{position:absolute;top:-5px;width:4px;height:20px;border-radius:2px;background:var(--a-ink)}
.tl .s{display:grid;grid-template-columns:26px 1fr;gap:10px;padding-bottom:14px;position:relative}
.tl .s:not(:last-child)::before{content:"";position:absolute;left:12px;top:24px;bottom:0;width:2px;background:var(--hair)}
.tl .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:#fff;border:2px solid #d5d6dc;color:var(--a-sub)}
.tl .s.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.tl .s.now .dot{border-color:var(--blue);color:var(--blue)}
.tl .s.x .dot{background:#8b8c96;border-color:#8b8c96;color:#fff}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:1px 9px;background:var(--blue-soft);color:var(--blue);font-weight:500}
.pill.w{background:var(--warn-bg);color:#8a5300}
.pill.g{background:var(--ok-bg);color:var(--ok)}
.pill.x{background:#ececf0;color:#666}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--a-sub)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.prog{height:8px;background:rgba(0,0,0,.08);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--new);border-radius:6px}
.lv{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:#fff;border:0;cursor:pointer;font:inherit;text-align:left;color:inherit;width:100%}
.lv .b{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;background:var(--new-bg);color:var(--new);flex:none}
.lv.done .b{background:var(--ok);color:#fff}
.lv.lock{opacity:.5;cursor:default}
.lcard{background:#fff;border-radius:18px;padding:18px;min-height:240px;display:flex;flex-direction:column;gap:10px}
.lcard h3{font-size:19px;margin:0}
.lcard p{margin:0;font-size:15px;line-height:1.7}
.ldots{display:flex;gap:5px;justify-content:center}
.ldots i{width:7px;height:7px;border-radius:50%;background:rgba(0,0,0,.12)}
.ldots i.on{background:var(--new);width:18px;border-radius:4px}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--hair);background:#fff;border-radius:12px;padding:11px 12px;font:inherit;font-size:14.5px;cursor:pointer;color:var(--a-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--up);background:var(--bad-bg)}
.li{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--hair);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;font:inherit;text-align:left;color:inherit;width:100%}
.li:last-child{border-bottom:0}
.li .mid{flex:1;min-width:0}
.li .mid b{display:block;font-size:15px;font-weight:500}
.li .mid span{font-size:12.5px;color:var(--a-sub)}
.svcgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

/* 浮層 */
.scrim{position:absolute;inset:0;background:rgba(10,20,30,.35);z-index:19}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:80%;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.2);display:flex;flex-direction:column;z-index:20}
.sheet.tall{height:78%}
.sh-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--hair)}
.sh-h b{flex:1}
.sh-h button{border:0;background:none;font-size:22px;cursor:pointer;color:var(--a-sub)}
.sh-b{padding:12px 16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.optrow{display:flex;flex-direction:column;gap:3px;text-align:left;border:1.5px solid var(--hair);border-radius:12px;padding:10px 12px;background:#fff;font:inherit;cursor:pointer;color:inherit}
.optrow.on{border-color:var(--blue);background:var(--blue-soft)}
.optrow b{font-size:15px}

const ALL=UNITS.flatMap(u=>u.lessons.map((l,i)=>Object.assign(l,{unit:u,idx:i})));
function findL(id){ return ALL.find(l=>l.id===id); }
function nextLesson(){ return ALL.find(l=>!l.soon&&!S.done.includes(l.id)); }

SCR.learn = () => { const nl=nextLesson(); const offs=[0,52,72,52,0,-52,-72,-52]; let k=0;
  const stat=`<div class="lstat"><span title="連續天數">🔥 <b>${S.streak}</b></span><span title="經驗值">⭐ <b>${S.xp}</b> XP</span><span class="lgoal">${ring(S.today,S.goal,34)}<span><b>${S.today}/${S.goal}</b> XP<br><span class="tiny">每日目標</span></span></span></div><button class="rwbar" data-go="rewards"><span>🎟️ 手續費抵用金 <b>${fmt(S.credit)}</b> 元</span><span>學習點 <b>${S.pts}</b>/100 ›</span></button>`;
  const units=UNITS.map((u,ui)=>{
    const nodes=u.lessons.map((l,li)=>{ const done=S.done.includes(l.id), isCur=nl&&nl.id===l.id, lock=!done&&!isCur; const off=offs[k++%offs.length];
      const ic=done?'✓':l.boss?'🏆':isCur?'★':'🔒';
      const node=`<div class="nwrap" style="transform:translateX(${off}px)">${isCur?`<div class="startTip">開始</div>`:''}<button class="node ${done?'done':''} ${isCur?'cur':''} ${lock?'lock':''} ${l.boss?'boss':''}" style="--uc:${u.color}" data-act="node" data-id="${l.id}" aria-label="${l.t}${done?'（已完成）':lock?'（未解鎖）':''}">${ic}</button><span class="nlab">${l.t}</span></div>`;
      const chest = li===1 ? `<div class="nwrap" style="transform:translateX(${offs[k++%offs.length]}px)"><button class="chest ${done?'open':''}" data-act="chest" data-id="${u.id}" data-open="${done?1:0}" aria-label="寶箱">${S.chests.includes(u.id)?'✨':done?'🎁':'🧰'}</button></div>` : '';
      const mascot = (li===1 && ui===0) ? `<div class="pmascot" style="${off>0?'left:6px':'right:6px'}">${sprout(66,isCur||done?'happy':'think')}</div>` : '';
      return node+chest+mascot; }).join('');
    return `<div class="ubanner" style="background:${u.color}"><span><span class="tiny" style="color:rgba(255,255,255,.85)">單元 ${ui+1}</span><br><b>${u.title}</b><br><span style="font-size:12.5px;opacity:.9">${u.sub}</span></span><button class="ugbtn" data-act="toast" data-t="單元指南：先看重點，再開始練習（示意）">📖 指南</button></div><div class="lpath">${nodes}</div>`; }).join('');
  return {back:true,title:'體驗區・新手學堂', body:`<div class="nw" style="border-radius:16px;padding:10px;background:#fffaf2;display:flex;flex-direction:column;gap:12px"><div class="tiny" style="text-align:right">${NEW}</div>${stat}${units}<div class="tiny" style="text-align:center;padding:6px 0">每關 1–2 分鐘・可以隨時離開・提醒時段可在「服務 → 偏好設定」調整</div></div>`};
};
function shuffleIdx(n,seed){ const a=[...Array(n).keys()]; let s=seed; for(let i=n-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor(s/233280*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function startLesson(id){ const l=findL(id); if(!l){ toast('即將推出'); return; } S.lesson={id,queue:l.ex.map((_,i)=>i),pos:0,mistakes:0,correct:0,start:Date.now()}; resetEx(); go('lesson'); }
function resetEx(){ const L=S.lesson, ex=findL(L.id).ex[L.queue[L.pos]]; Object.assign(L,{sel:null,checked:false,right:null,fill:null,matched:[],pickL:null,flash:null,sim:{lot:'整股',qty:1}}); if(ex&&ex.type==='match') L.rOrder=shuffleIdx(ex.pairs.length,L.pos*7+3); }
function curEx(){ const L=S.lesson; return findL(L.id).ex[L.queue[L.pos]]; }
function simCalc(){ const s=S.lesson.sim, sh=s.lot==='整股'?s.qty*1000:s.qty; return {sh,amt:Math.round(sh*36.2)}; }
SCR.lesson = () => { const L=S.lesson, l=findL(L.id), ex=curEx(); const pct=Math.round(Math.min(L.pos,L.queue.length)/L.queue.length*100);
  const top=`<div class="lhead"><button class="lx" data-act="lquit" aria-label="離開關卡">✕</button><div class="lbar"><i style="width:${pct}%"></i></div><span class="tiny">${l.unit.title}</span></div>`;
  let body='', can=false;
  if(ex.type==='card') body=say('先看一個重點','happy')+`<div class="tcard"><span class="pill w" style="align-self:flex-start">重點卡</span><h3>${ex.h}</h3><p>${ex.p}</p></div>`;
  else if(ex.type==='choice'){ body=say(ex.q,'think')+`<div class="optlist">${ex.opts.map((o,i)=>`<button class="dopt ${L.sel===i?'sel':''} ${L.checked&&i===ex.a?'right':''} ${L.checked&&L.sel===i&&i!==ex.a?'wrong':''}" data-act="lsel" data-i="${i}" ${L.checked?'disabled':''}><span class="k">${i+1}</span>${o}</button>`).join('')}</div>`; can=L.sel!=null; }
  else if(ex.type==='fill'){ body=say(ex.q,'think')+`<div class="fillline">${ex.parts[0]}<button class="blank ${L.fill?'filled':''} ${L.checked?(L.right?'right':'wrong'):''}" data-act="fclear" ${L.checked?'disabled':''}>${L.fill||'　　　'}</button>${ex.parts[1]}</div><div class="bank">${ex.bank.map(w=>`<button class="wchip ${L.fill===w?'used':''}" data-act="fpick" data-v="${w}" ${L.checked||L.fill===w?'disabled':''}>${w}</button>`).join('')}</div>`; can=!!L.fill; }
  else if(ex.type==='match'){ body=say(ex.q,'think')+`<div class="mgrid"><div class="mcol">${ex.pairs.map((p,i)=>`<button class="mbtn ${L.matched.includes(i)?'ok':''} ${L.pickL===i?'sel':''} ${L.flash&&L.flash[0]===i?'bad':''}" data-act="mL" data-i="${i}" ${L.matched.includes(i)?'disabled':''}>${p[0]}</button>`).join('')}</div><div class="mcol">${L.rOrder.map(j=>`<button class="mbtn ${L.matched.includes(j)?'ok':''} ${L.flash&&L.flash[1]===j?'bad':''}" data-act="mR" data-i="${j}" ${L.matched.includes(j)?'disabled':''}>${ex.pairs[j][1]}</button>`).join('')}</div></div>`; }
  else if(ex.type==='sim'){ const s=L.sim, c=simCalc(); can=true;
    body=say(ex.q,'think')+`<div class="simbox"><div class="row"><b>元大高股息 0056</b><span class="lotsw">${['整股','零股'].map(t=>`<button class="${s.lot===t?'on':''}" data-act="slot" data-v="${t}" ${L.checked?'disabled':''}>${t}</button>`).join('')}</span></div>
      <div class="stepper"><button data-act="sqty" data-d="-1" ${L.checked?'disabled':''}>−</button><span class="v">${fmt(s.qty)}</span><button data-act="sqty" data-d="1" ${L.checked?'disabled':''}>＋</button></div>
      ${s.lot==='零股'?`<div class="chips">${[100,200,270,300].map(v=>`<button class="chip ${s.qty===v?'on':''}" data-act="sset" data-v="${v}" ${L.checked?'disabled':''}>${v} 股</button>`).join('')}</div>`:''}
      <div class="livebuy">你正在買進 <b>${fmt(c.sh)} 股</b>・約 ${fmt(c.amt)} 元</div><span class="tiny">練習用，不會真的下單</span></div>`; }
  let fixed;
  if(ex.type==='card') fixed=`<div class="lfoot"><button class="dbtn" data-act="lnext">繼續</button></div>`;
  else if(ex.type==='match') fixed=L.checked?fb(true,'全部配對完成！'):`<div class="lfoot"><span class="tiny" style="text-align:center">先點左邊，再點右邊的對應說明</span></div>`;
  else if(!L.checked) fixed=`<div class="lfoot"><button class="dbtn" data-act="lcheck" ${can?'':'disabled'}>檢查</button></div>`;
  else fixed=fb(L.right,ex.why,ex);
  return {top,full:true,body:`<div class="lbody">${body}</div>`,fixed};
};
function fb(ok,why,ex){ const ans=ex&&!ok?(ex.type==='choice'?`正確答案：${ex.opts[ex.a]}<br>`:ex.type==='fill'?`正確答案：${ex.a}<br>`:''):'';
  return `<div class="fb ${ok?'ok':'no'}"><div class="fbh">${ok?'✓ 答對了！':'差一點！'}</div><div class="fbt">${ans}${why}</div>${ok?'':'<div class="tiny" style="color:inherit;opacity:.8">這題等一下會再出現一次</div>'}<button class="dbtn ${ok?'':'org'}" data-act="lnext">繼續</button></div>`; }
function addCredit(v,t){ S.credit+=v; S.ledger.unshift({t,v,d:'11/16'}); }
function addPts(v,t){ S.pts+=v; S.ledger.unshift({t,v,pt:true,d:'11/16'}); }
function finishLesson(){ const L=S.lesson,l=findL(L.id); const graded=l.ex.filter(e=>e.type!=='card').length; const first=!S.done.includes(l.id);
  const xp=(first?10:5)+(L.mistakes===0?5:0); S.xp+=xp; S.today+=xp; if(first) S.done.push(l.id);
  let streakUp=false; if(!S.studiedToday){ S.studiedToday=true; S.streak++; streakUp=true; }
  const rw=[]; if(!S.goalHit&&S.today>=S.goal){ S.goalHit=true; addPts(10,'每日目標達成'); rw.push(['🎯','每日目標達成','+10 學習點']); }
  if(l.boss&&first){ addCredit(50,'完成單元挑戰：'+l.unit.title); rw.push(['🏆','完成單元挑戰','手續費抵用金 50 元']); }
  if(S.streak>=7&&!S.streak7){ S.streak7=true; addCredit(30,'連續學習 7 天'); rw.push(['🔥','連續學習 7 天','手續費抵用金 30 元']); }
  if(S.pts>=100) rw.push(['🔁','學習點滿 100','可兌換 10 元']);
  const sec=Math.max(20,Math.round((Date.now()-L.start)/1000));
  S.lastResult={rw,id:l.id,xp,acc:Math.round(graded/Math.max(1,graded+L.mistakes)*100),time:Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'),streakUp};
  S.lesson=null; stack=[{name:'home',p:{}},{name:'learn',p:{}}]; cur={name:'lessonDone',p:{}}; render(); }
SCR.lessonDone = () => { const r=S.lastResult, l=findL(r.id); const wk=['一','二','三','四','五','六','日'];
  return {full:true, top:'<div style="height:8px"></div>', body:`<div class="lbody" style="align-items:center;text-align:center;gap:14px">
   <div style="margin-top:8px">${sprout(110,'cheer')}</div><h2 style="margin:0;font-size:24px;color:#c8620e">關卡完成！</h2><div class="sub">「${l.t}」</div>
   <div class="dstats"><div><span>總 XP</span><b>+${r.xp}</b></div><div><span>正確率</span><b>${r.acc}%</b></div><div><span>用時</span><b>${r.time}</b></div></div>
   ${r.rw.length?`<div class="rwbox"><b>獲得獎勵 🎁</b>${r.rw.map(([i,t,v])=>`<div class="rwi"><span style="font-size:22px">${i}</span><span style="flex:1;text-align:left">${t}</span><b>${v}</b></div>`).join('')}<button class="btn sm ghost" data-go="rewards">查看我的學習獎勵</button></div>`:''}
   ${r.streakUp?`<div class="streakc"><div style="font-size:28px">🔥 <b>${S.streak}</b> 天連續學習</div><div class="wk">${wk.map((w,i)=>`<span class="${i<=3?'on':''}">${w}</span>`).join('')}</div><span class="tiny">今天的目標 ${S.today}/${S.goal} XP${S.today>=S.goal?'・已達成 🎉':''}</span></div>`:''}
   ${l.cta?`<div class="explain" style="text-align:left;width:100%"><b>學完立即實戰</b>：把剛學到的，在 App 裡真正的功能上試一次。</div>`:''}</div>`,
   fixed:`<div class="lfoot">${l.cta?`<button class="dbtn" data-act="doCta" data-id="${l.id}">${l.cta[0]}</button><button class="dbtn ghost" data-act="toPath">回到學習路徑</button>`:`<button class="dbtn" data-act="toPath">繼續學習</button>`}</div>`};
};

  <div class="card"><h3>怎麼拿獎勵</h3>${RULES.map(([i,t,v],k)=>`<div class="li" style="cursor:default"><span style="font-size:22px">${i}</span><span class="mid"><b>${t}</b><span>${k===3?`目前連續 ${S.streak} 天`:k===0?(S.goalHit?'今天已達成':'今天 '+S.today+'/'+S.goal+' XP'):''}</span></span><span class="pill w">${v}</span></div>`).join('')}</div>
  <div class="card"><h3>紀錄</h3>${S.ledger.length?S.ledger.map(e=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--hair);font-size:13.5px"><span>${e.t}</span><b class="num ${e.v<0?'dn':''}">${e.v>0?'+':''}${e.v}${e.pt?' 點':' 元'}</b></div>`).join(''):'<p class="sub" style="margin:6px 0 0">完成第一關就會開始累積。</p>'}</div>
  <div class="explain">只要學習就能領，<b>不需要先交易</b>；抵用金只折抵台股電子下單手續費，每筆最多折抵當筆手續費，不能換現金。實際規則以元大公告為準（示意）。</div></div>
  <button class="btn" data-go="learn">回到學習路徑</button>`});

/* ----- 小芽：名詞解釋與情境求助（新手輔助的一部分） ----- */
function sheetHTML(){ const o=S.order; if(!S.sheet||!o) return '';
  if(S.sheet==='mode'){ const opts=o.lot==='整股'?[['board','整股 ROD','單位是張，1 張 = 1,000 股']]:[['odd','盤中零股','9:00–13:30，約每分鐘撮合一次'],['after','盤後零股','13:40–14:30 下單，14:30 一次撮合']];
    return `<div class="scrim" data-act="closeSheet"></div><div class="sheet"><div class="sh-h"><b>交易方式</b><button data-act="closeSheet">×</button></div><div class="sh-b">${opts.map(([k,t,d])=>`<button class="optrow ${o.mode===k?'on':''}" data-act="mode" data-v="${k}"><b>${t}</b>${S.guide?`<span class="sub">${d}</span>`:''}</button>`).join('')}</div></div>`; }
  const dis=o.mode!=='board';
  return `<div class="scrim" data-act="closeSheet"></div><div class="sheet"><div class="sh-h"><b>價格條件</b><button data-act="closeSheet">×</button></div><div class="sh-b">
    <button class="optrow ${o.ptype==='limit'?'on':''}" data-act="ptype" data-v="limit"><b>限價</b>${S.guide?'<span class="sub">設定你願意付的最高價，不會買貴，但可能買不到</span>':''}</button>
    <button class="optrow ${o.ptype==='market'?'on':''}" data-act="ptype" data-v="market" ${dis?'disabled style="opacity:.45"':''}><b>市價</b>${S.guide?`<span class="sub">照當下價格馬上成交${dis?'（零股只能用限價）':''}</span>`:''}</button></div></div>`; }
const KB=[
 [/(推薦|買哪|哪一檔|會漲|會跌|明牌|適合我)/,'我不會推薦要買哪一檔，也沒辦法預測漲跌。我可以幫你比較商品差在哪、解釋名詞，或試算投入金額。',[['比較兩檔 ETF','compare']]],
 [/(整股|張)/,'整股的單位是「張」，1 張 = 1,000 股；零股的單位是「股」。下單頁會即時顯示「你正在買進幾股」，切換後記得重新確認。'],
 [/(零股)/,'零股是不到 1 張的股票，單位是「股」。盤中零股 9:00–13:30 下單，約每分鐘撮合；盤後零股 13:40–14:30 下單，14:30 一次撮合。零股只能用限價。'],
 [/(限價|市價)/,'限價是你願意付的最高價：市場價格比它高就不會成交，不會買貴但可能買不到。市價是照當下價格成交，速度快，價格可能高一點。'],
 [/(違約|交割)/,'違約交割是成交後兩個交易日，交割帳戶的錢不夠扣。下單頁會算好扣款金額，餘額不足時會先提醒你。'],
 [/(取消)/,'還沒成交的委託都可以取消。到「交易 → 委託」點那筆單，按取消；看到「已取消」才算完成。'],
 [/(還沒成交|沒成交|排隊)/,'通常是你的限價比賣方掛的價格低，所以還在排隊。可以再等等，或取消後用新的價格重下。'],
 [/(除息|股利|配息)/,'除息那天股價會先扣掉要發的股利，帳面看起來會跌；股利會在發放日匯進你的帳戶。'],
 [/(定期定額|扣款)/,'定期定額是每月固定日子、固定金額自動買進。扣款日可以選 1–28 號，設定後可以在「交易 → 委託 → 定期定額明細」看結果。',[['設定定期定額','dca']]],
 [/(報酬|變少|為什麼變|變了)/,'基本報酬是（現價 − 平均成本）× 股數。今天的變化主要來自大盤上漲，以及兆豐金下跌。',[['看原因','why']]],
 [/(殖利率)/,'殖利率是一年股利除以股價。例如股價 100 元、一年配 5 元，殖利率就是 5%。殖利率高不一定比較好，也要看能不能穩定配息。'],
 [/(持股|占比|標示)/,'ETF 標示卡會列出前五大持股與占比。某一家公司占比越高，它的漲跌對這檔 ETF 的影響越大。'],
];
const CHIPS={trade:['整股跟零股差在哪？','限價跟市價差在哪？','我會不會違約交割？'],confirm:['我會不會違約交割？','送出後可以取消嗎？'],status:['為什麼還沒成交？','委託中可以取消嗎？'],why:['除息是什麼？'],product:['殖利率是什麼？','持股占比怎麼看？'],compare:['要買哪一檔比較好？','殖利率是什麼？'],dca:['定期定額是什麼？'],holding:['報酬怎麼算？'],_:['為什麼報酬變了？','定期定額是什麼？','要買哪一檔比較好？']};
function aiAnswer(q){ for(const [re,a,acts] of KB){ if(re.test(q)) return {a,acts}; } return {a:'這題我還不確定怎麼回答，怕給你錯的資訊。你可以換個說法，或聯絡線上客服。'}; }
function ask(q){ S.ai.open=true; S.sheet=null; if(!S.ai.msgs.length) S.ai.msgs.push({t:greet()}); S.ai.msgs.push({me:true,t:esc(q)}); const r=aiAnswer(q); S.ai.msgs.push({t:r.a,acts:r.acts}); renderOverlay(); }
function greet(){ return '嗨，我是小芽。我只解釋名詞和操作，不會推薦個股。這一頁有什麼不懂的嗎？'; }
function renderOverlay(){ const o=$('#overlay');
  if(S.sheet){ o.innerHTML=sheetHTML(); return; }
  if(!S.ai.open){ o.innerHTML=''; return; }
  if(!S.ai.msgs.length) S.ai.msgs.push({t:greet()});
  const chips=CHIPS[cur.name]||CHIPS._;
  o.innerHTML=`<div class="scrim" data-act="closeAI"></div><div class="sheet tall" role="dialog" aria-label="小芽情境求助">
    <div class="sh-h">${sprout(30,'happy')}<b>問小芽 <span class="badge">新增</span></b><button data-act="closeAI" aria-label="關閉">×</button></div>
    <div class="msgs" id="msgs">${S.ai.msgs.map(m=>`<div class="m ${m.me?'me':'bot'}">${m.t}${m.acts?`<div class="acts">${m.acts.map(([t,g])=>`<button class="btn sm ghost" data-act="aiGo" data-g="${g}">${t}</button>`).join('')}</div>`:''}</div>`).join('')}</div>
    <div class="sh-f"><div class="chips">${chips.map(c=>`<button class="chip" data-act="ask" data-q="${c}">${c}</button>`).join('')}</div>
      <form id="aiForm"><input id="aiInput" placeholder="輸入問題，例如：零股是什麼？" autocomplete="off"><button class="btn sm" type="submit">送出</button></form>
      <span class="tiny">只解釋、不推薦個股・不會離開目前的頁面</span></div></div>`;
  const ms=$('#msgs'); ms.scrollTop=ms.scrollHeight;
  $('#aiForm').addEventListener('submit',e=>{e.preventDefault(); const v=$('#aiInput').value.trim(); if(v) ask(v);});
}

/* ---------- 主繪製 ---------- */
function render(){
  if(cur.name==='lesson'&&!S.lesson) cur={name:'learn',p:{}};
  if(cur.name==='lessonDone'&&!S.lastResult) cur={name:'learn',p:{}};
  if(cur.name==='confirm'&&!S.order) S.order=newOrder('0056');
  if(cur.name==='dcaDone'&&!S.dcas.length) cur={name:'home',p:{}};
  const s=SCR[cur.name](cur.p||{});
  const isTab=TABS.includes(cur.name);
  $('#top').innerHTML = s.top || `<div class="ptitle">${s.back?'<button class="bk" data-act="back" aria-label="返回">‹</button>':''}<h2>${s.title||''}</h2>${s.right?`<span class="rt">${s.right}</span>`:''}</div>`;
  const sc=$('#scroll'); sc.innerHTML=s.body; sc.scrollTop=0;
  $('#fixedBar').innerHTML=s.fixed||'';
  const navT=[['home','首頁','home','homeO'],['watch','自選','star','starO'],['trade','交易'],['market','行情','candle','candle'],['service','服務','grid','grid']];
  const active=isTab?cur.name:(stack.find(z=>TABS.includes(z.name))||{name:'home'}).name;
  $('#nav').innerHTML=navT.map(([k,t,a,b])=>k==='trade'?`<button class="mid ${active===k?'on':''}" data-act="tab" data-id="trade"><span class="coin">$</span><span class="l">交易</span></button>`:`<button class="${active===k?'on':''}" data-act="tab" data-id="${k}">${active===k?IC[a]:IC[b]}${t}</button>`).join('');
  const fab=$('#fab'); fab.classList.toggle('lift',!!s.fixed); fab.style.display=(s.full||!S.guide)?'none':'';
  $('#nav').style.display=s.full?'none':'';
  sc.style.paddingBottom=s.fixed?'20px':'96px';
  renderOverlay();
}

/* ---------- 事件 ---------- */
document.addEventListener('change',e=>{ const t=e.target;
  if(t.dataset.cmp!=null){ S.cmp[+t.dataset.cmp]=t.value; render(); }
  else if(t.hasAttribute('data-dcaday')){ S._dca.day=+t.value; render(); }
  else if(t.dataset.calc==='amt'){ const v=Math.max(100,Math.min(10000000,Math.round(+t.value||0))); S.calc.amt=v; S.tried=true; render(); }
});
document.addEventListener('input',e=>{ const t=e.target;
  if(t.dataset.input==='other'&&S.order) S.order.other=t.value;
  else if(t.dataset.input==='rvtxt'){ S._rv.txt=t.value; const b=document.querySelector('[data-act="saveRv"]'); if(b) b.disabled=!(S._rv.tag||S._rv.txt.trim()); }
});
document.addEventListener('click',e=>{
  if(!e.target.closest('#phone')) return;
  if(e.target.closest('#fab')){ S.ai.open=true; S.sheet=null; renderOverlay(); return; }
  const g=e.target.closest('[data-go]'); if(g){ const p={}; if(g.dataset.sym) p.sym=g.dataset.sym; if(g.dataset.id) p.id=+g.dataset.id; if(g.dataset.go==='dca') S._dca=null; if(g.dataset.go==='holding') S._rv=null; go(g.dataset.go,p); return; }
  const a=e.target.closest('[data-act]'); if(!a||a.disabled) return; const d=a.dataset, o=S.order;
  switch(d.act){
    case 'back': back(); break;
    case 'tab': tab(d.id); break;
    case 'toast': toast(d.t); break;
    case 'eye': S.showAmt=!S.showAmt; render(); break;
    case 'hideTask': S.taskHidden=true; render(); toast('已關閉任務卡'); break;
    case 'homeTab': S.homeTab=d.v; render(); break;
    case 'homeChip': S.homeChip=d.v; render(); break;
    case 'watchTab': S.watchTab=d.v; render(); break;
    case 'mktSeg': S.mktSeg=d.v; render(); break;
    case 'invSeg': S.invSeg=d.v; render(); break;
    case 'tradeSub': S.tradeSub=d.v; stack=[]; cur={name:'trade',p:{}}; S.ai.open=false; render(); break;
    case 'addWatch': if(!S.watch['自選1'].includes(d.sym)) S.watch['自選1'].push(d.sym); render(); toast('已加入自選1'); break;
    case 'later': if(!S.watch['自選3'].includes(d.sym)) S.watch['自選3'].push(d.sym); render(); toast('已放到自選3，稍後再看'); break;
    case 'camt': S.calc.amt=+d.v; S.tried=true; render(); break;
    case 'cdrop': S.calc.drop=+d.v; S.tried=true; render(); break;
    case 'openDca': S._dca=null; go('dca',{}); break;
    case 'dcaFor': S._dca=null; go('dca',{sym:d.sym}); break;
    case 'dset': S._dca[d.k]=d.k==='sym'?d.v:+d.v; render(); break;
    case 'saveDca': { const dd={...S._dca, first:nextDate(S._dca.day), status:'wait'}; S.dcas.push(dd); S._dca=null; stack=[]; cur={name:'dcaDone',p:{}}; render(); toast('定期定額已設定（示意）'); break; }
    case 'dcaRun': { const dd=S.dcas[+d.i], x=P[dd.sym]; dd.status='done'; dd.got=Math.floor(dd.amt/x.price); const h=S.holdings[dd.sym];
      if(h){ h.cost=+((h.cost*h.qty+x.price*dd.got)/(h.qty+dd.got)).toFixed(2); h.qty+=dd.got; } else S.holdings[dd.sym]={qty:dd.got,cost:x.price};
      S.trades.unshift({d:'2026/'+dd.first,side:'買',sym:dd.sym,qty:dd.got,price:x.price,reason:'定期定額'}); render(); toast('首次扣款成功（示意）'); break; }
    case 'buy': S.order=newOrder(d.sym,'零股'); S.tradeSub='order'; stack=[]; cur={name:'trade',p:{}}; render(); break;
    case 'lot': if(o.lot===d.v) break; o.lot=d.v; if(d.v==='整股'){o.mode='board';o.qty=1;} else {o.mode='odd';o.qty=50;o.ptype='limit';} o.switched=d.v; render(); break;
    case 'sheet': S.sheet=d.v; renderOverlay(); break;
    case 'closeSheet': S.sheet=null; renderOverlay(); break;
    case 'mode': o.mode=d.v; S.sheet=null; render(); break;
    case 'ptype': if(d.v==='market'&&o.mode!=='board') break; o.ptype=d.v; S.sheet=null; render(); break;
    case 'guide': S.guide=!S.guide; render(); toast(S.guide?'新手輔助已開啟':'新手輔助已關閉：股數、金額、費用與必要提醒仍會顯示'); break;
    case 'remind': S.remind=!S.remind; render(); break;
    case 'qset': o.qty=+d.v; o.switched=null; render(); break;
    case 'oset': o[d.k]= o[d.k]===d.v?null:d.v; render(); if(d.v==='其他'&&o.reason==='其他'){ const i=document.querySelector('[data-input="other"]'); if(i) i.focus(); } break;
    case 'price': { const t=tick(o.price); o.price=Math.max(t,+(o.price+(+d.d)*t).toFixed(2)); render(); break; }
    case 'qty': { const step=o.mode==='board'?1:(o.qty>=100?50:10); o.qty=Math.max(1,Math.min(o.mode==='board'?99:999,o.qty+(+d.d)*step)); o.switched=null; render(); break; }
    case 'submit': { const id=Date.now(); S.orders.push({...o,id,status:'pending',disc:calc(o).disc}); S.tradeSub='orders'; stack=[{name:'trade',p:{}}]; cur={name:'status',p:{id}}; render(); toast('委託已送出'); break; }
    case 'openOrder': { const p=S.orders.filter(z=>z.status==='pending').pop(); go('status',{id:p.id}); break; }
    case 'cancel': { const z=S.orders.find(q=>q.id===+d.id); z.status='cancelling'; render(); setTimeout(()=>{ z.status='cancelled'; if(cur.name==='status') render(); toast('取消成功'); },1200); break; }
    case 'fill': { const z=S.orders.find(q=>q.id===+d.id); z.status='filled'; if(z.disc){ S.credit-=z.disc; S.ledger.unshift({t:'下單折抵手續費 '+z.sym,v:-z.disc,d:'11/16'}); }
      const c=calc(z); const h=S.holdings[z.sym];
      if(h){ h.cost=+((h.cost*h.qty+c.price*c.shares)/(h.qty+c.shares)).toFixed(2); h.qty+=c.shares; } else S.holdings[z.sym]={qty:c.shares,cost:c.price};
      S.trades.unshift({d:'2026/11/16',side:'買',sym:z.sym,qty:c.shares,price:c.price,reason:z.reason?reasonText(z):null,mood:z.mood}); render(); toast('已成交（示意）'); break; }
    case 'rvtag': S._rv.tag=S._rv.tag===d.v?null:d.v; render(); break;
    case 'saveRv': { const r=S._rv; (S.reviews[d.sym]=S.reviews[d.sym]||[]).unshift({d:'2026/11/16',tag:r.tag,txt:r.txt.trim()}); S._rv={tag:null,txt:''}; S.reviewed=true; render(); toast('已儲存回顧'); break; }
    case 'startLesson': startLesson(d.id); break;
    case 'node': { const l=findL(d.id), nl=nextLesson(); if(S.done.includes(l.id)||(nl&&nl.id===l.id)) startLesson(l.id); else toast('先完成前面的關卡，就會解鎖'); break; }
    case 'chest': { if(d.open!=='1'){ toast('完成前一關就能打開寶箱'); break; } if(S.chests.includes(d.id)){ toast('這個寶箱已經領過了'); break; } S.chests.push(d.id); addPts(5,'打開寶箱'); render(); toast('寶箱打開！+5 學習點'+(S.pts>=100?'，可以兌換抵用金了':'')); break; }
    case 'redeem': if(S.pts>=100){ S.pts-=100; S.ledger.unshift({t:'學習點兌換',v:-100,pt:true,d:'11/16'}); addCredit(10,'學習點兌換抵用金'); render(); toast('已兌換 10 元手續費抵用金'); } break;
    case 'lquit': S.lesson=null; back(); toast('已離開，這一關的進度不會保存'); break;
    case 'lsel': S.lesson.sel=+d.i; render(); break;
    case 'fpick': S.lesson.fill=d.v; render(); break;
    case 'fclear': S.lesson.fill=null; render(); break;
    case 'mL': S.lesson.pickL=+d.i; S.lesson.flash=null; render(); break;
    case 'mR': { const L=S.lesson; if(L.pickL==null){ toast('先點左邊的名詞'); break; } const j=+d.i;
      if(j===L.pickL){ L.matched.push(j); L.pickL=null; L.flash=null; if(L.matched.length===curEx().pairs.length){ L.checked=true; L.right=true; L.correct++; } }
      else { L.flash=[L.pickL,j]; L.mistakes++; L.pickL=null; } render(); break; }
    case 'slot': S.lesson.sim.lot=d.v; S.lesson.sim.qty=d.v==='整股'?1:100; render(); break;
    case 'sqty': { const s=S.lesson.sim, st=s.lot==='整股'?1:10; s.qty=Math.max(1,Math.min(999,s.qty+(+d.d)*st)); render(); break; }
    case 'sset': S.lesson.sim.qty=+d.v; render(); break;
    case 'lcheck': { const L=S.lesson, ex=curEx(); let ok=false;
      if(ex.type==='choice') ok=L.sel===ex.a; else if(ex.type==='fill') ok=L.fill===ex.a; else if(ex.type==='sim'){ const c=simCalc(); ok=L.sim.lot==='零股'&&c.amt<=10000&&c.amt>=8000; }
      L.checked=true; L.right=ok; if(ok) L.correct++; else { L.mistakes++; L.queue.push(L.queue[L.pos]); } render(); break; }
    case 'lnext': { const L=S.lesson; L.pos++; if(L.pos>=L.queue.length) finishLesson(); else { resetEx(); render(); } break; }
    case 'toPath': stack=[{name:'home',p:{}}]; cur={name:'learn',p:{}}; render(); break;
    case 'doCta': { const l=findL(d.id); const [,kind,arg]=l.cta;
      if(kind==='buy'){ S.order=newOrder(arg,'零股'); S.tradeSub='order'; stack=[]; cur={name:'trade',p:{}}; }
      else if(kind==='inv'){ S.tradeSub='inv'; stack=[]; cur={name:'trade',p:{}}; }
      else { stack=[{name:'learn',p:{}}]; cur={name:arg,p:{}}; }
      render(); toast('實戰任務：把剛學到的試一次'); break; }
    case 'ask': ask(d.q); break;
    case 'openAI': S.ai.open=true; renderOverlay(); break;
    case 'closeAI': S.ai.open=false; renderOverlay(); break;
    case 'aiGo': S.ai.open=false; if(d.g==='dca') S._dca=null; go(d.g,{}); break;
  }
});

$('#fab').innerHTML=sprout(34,'happy')+'問小芽<span class="badge">新增</span>';
render();
})();
</script>
